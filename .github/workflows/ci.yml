name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release using the Cargo.toml version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest
    container: rust:1.99.1-slim-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev liblzma-dev
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-deb --version 3.8.0 --locked
      - run: cargo deb --locked
      - name: Smoke-test package installation
        run: |
          apt-get install -y --no-install-recommends ./target/debian/*.deb
          PAM_TYPE=close_session /usr/sbin/ensure-subid --strict
      - uses: actions/upload-artifact@v7
        with:
          name: debian
          path: target/debian/*.deb
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: debian
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: debian
          path: build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          TAG="v$VERSION"
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
          gh release create "$TAG" build/*.deb --verify-tag --title "$TAG" --generate-notes
